version: 2

models:
  - name: bronze__ecommerce__products
    description: >
      Бронзовый слой. Модель для таблицы каталога товаров.

    columns:
      - name: id
        description: Уникальный идентификатор товара.
        tests:
          - not_null
          - unique

      - name: cost
        description: Себестоимость производства или закупки товара.

      - name: category
        description: Категория товара.

      - name: name
        description: Наименование товара.

      - name: brand
        description: Бренд/производитель товара.

      - name: retail_price
        description: Рекомендуемая розничная цена товара в магазине.

      - name: department
        description: Целевой отдел (для кого предназначен товар).

      - name: sku
        description: Складской идентификатор товара (хеш-строка).

      - name: distribution_center_id
        description: Идентификатор распределительного центра/склада.

      - name: _loaded_at
        description: Дата и время загрузки записи в бронзовый слой.